<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mahi_plays</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle,#ffcc0030 2px,transparent 2px);
background-size:50px 50px;
animation:moveParticles 20s linear infinite;
pointer-events:none;
}

@keyframes moveParticles{
from{transform:translateY(0);}
to{transform:translateY(-200px);}
}

.banner{
height:280px;
background:url("background.png") center/cover no-repeat;
position:relative;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
}

.profile-box{
text-align:center;
margin-top:-80px;
position:relative;
z-index:2;
}

.profile{
width:160px;
height:160px;
border-radius:50%;
border:5px solid #ffcc00;
object-fit:cover;

animation:pulseGlow 1.5s ease-in-out infinite;
}

@keyframes pulseGlow{
    0%{
        box-shadow:0 0 10px #ffcc00;
    }

    50%{
        box-shadow:
        0 0 25px #ffcc00,
        0 0 50px #ffcc00,
        0 0 75px #ffcc00;
    }

    100%{
        box-shadow:0 0 10px #ffcc00;
    }
}

.logo{
width:120px;
margin-top:10px;
}

h1{
    font-size:60px;
    color:#ffcc00;
    text-transform:uppercase;
    animation:titleGlow 2s infinite alternate;
}

@keyframes titleGlow{
    from{
        text-shadow:
        0 0 10px #ffcc00,
        0 0 20px #ffcc00;
    }

    to{
        text-shadow:
        0 0 20px #ffcc00,
        0 0 40px #ffcc00,
        0 0 80px #ffcc00;
    }
}

.youtube-btn{
    display:inline-block;
    padding:12px 25px;
    background:red;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;

    box-shadow:0 0 15px red;

    transition:.3s;
}

.youtube-btn:hover{
    box-shadow:
        0 0 20px red,
        0 0 40px red;
    transform:scale(1.05);
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#141c2f;
padding:20px;
border-radius:15px;
text-align:center;

border:1px solid rgba(255,204,0,.3);
box-shadow:0 0 15px rgba(255,204,0,.2);

transition:all .3s ease;
}

.card:hover{
transform:translateY(-8px);
box-shadow:
0 0 20px rgba(255,204,0,.5),
0 0 40px rgba(255,204,0,.3);
}

.card h3{
color:#bbb;
}

.card p{
font-size:30px;
color:#ffcc00;
margin-top:10px;
}

.section{
padding:20px 40px;
}

.chart{
background:#141c2f;
padding:20px;
border-radius:15px;
}

svg{
width:100%;
height:200px;
}

.dancing{
text-align:center;
margin-top:30px;
font-size:80px;
animation:dance 1s infinite alternate;
}

@keyframes dance{
from{
transform:rotate(-10deg);
}
to{
transform:rotate(10deg);
}
}

.footer{
text-align:center;
padding:30px;
color:#888;
}
</style>
</head>

<body>

<div class="banner">
<div class="overlay"></div>
</div>

<div class="profile-box">
<img src="profile.png" class="profile">
<br>
<img src="logo.png" class="logo">

<h1>mahi_plays</h1>

<a class="youtube-btn"
href="https://www.youtube.com/@Maahiplays"
target="_blank">
Subscribe on YouTube
</a>
</div>

<div class="stats">

<div class="card">
<h3>Total Matches</h3>
<p>khel na nahi ata</p>
</div>

<div class="card">
<h3>Wins</h3>
<p>khel na nahi ata</p>
</div>

<div class="card">
<h3>K/D Ratio</h3>
<p>khel na nahi ata</p>
</div>

<div class="card">
<h3>Rank</h3>
<p>khel na nahi ata</p>
</div>

</div>

<div class="section">
<div class="card">
<h2>ye kya hota hai</h2>
<br>
<p>ye kya hota hai</p>
</div>
</div>

<div class="section">
<div class="chart">
<h2>Performance Graph</h2>

<svg viewBox="0 0 500 200">
<polyline
fill="none"
stroke="#ffcc00"
stroke-width="5"
points="
20,40
100,60
180,90
260,120
340,145
420,170
480,190
"/>
</svg>

</div>
</div>

<div class="section">
<h2 style="text-align:center;">kya dekh rahe ho mene mehnat kari hai</h2>

<div class="dancing">
🕺
</div>
</div>

<div class="footer">
© 2026 mahi_plays Gaming Dashboard
</div>

</body>
</html>
